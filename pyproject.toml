[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliproxy-billing-bot"
version = "0.1.0"
description = "Telegram billing ledger for CLIProxyAPI Usage Keeper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "aiosqlite>=0.21,<1",
  "apscheduler>=3.11,<4",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
]

[project.scripts]
cliproxy-billing-bot = "cliproxy_billing.main:run"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cliproxy_billing"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
